[project]
name = "slm"
version = "0.1.0"
description = "Small Language Model: pre-treino, mid-training, SFT, avaliacao e demo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=3.0",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "streamlit>=1.40",
    "tiktoken>=0.8",
    "torch>=2.6",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Driver do cluster: CUDA 12.8
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
