[project]
name = "slm"
version = "0.1.0"
description = "Small Language Model: pre-treino, mid-training, SFT, avaliacao e demo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
    "torch>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slm"]

# Driver do cluster: CUDA 12.8
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
